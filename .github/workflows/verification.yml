name: RTL Simulation and Verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cocotb-verilator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install system Python and Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-pip verilator make g++
          python3 --version
          verilator --version
      - name: Create isolated Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/cocotb-config --version
      - name: Run all cocotb test suites
        shell: bash
        run: |
          set -euo pipefail
          # Ubuntu's Verilator helper scripts use /usr/bin/python3.
          # Keep system Python 3.12 and its standard library intact;
          # cocotb itself is provided by the venv on PATH.
          export PATH="$PWD/.venv/bin:$PATH"
          unset PYTHONHOME
          for top in cache_lookup cache_arrays cache_lru cache_controller; do
            make clean
            make TOPLEVEL="$top"
          done
          make clean
          make MODULE=test_cache_randomized
